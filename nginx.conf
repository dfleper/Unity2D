server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Archivos WebAssembly comprimidos
    location ~ \.wasm\.br$ {
        gzip off;
        types {}
        default_type application/wasm;
        add_header Content-Encoding br;
        try_files $uri =404;
    }

    # Archivos JavaScript comprimidos
    location ~ \.js\.br$ {
        gzip off;
        types {}
        default_type application/javascript;
        add_header Content-Encoding br;
        try_files $uri =404;
    }

    # Datos y recursos comprimidos
    location ~ \.(data|symbols\.json)\.br$ {
        gzip off;
        types {}
        default_type application/octet-stream;
        add_header Content-Encoding br;
        try_files $uri =404;
    }

    # WebAssembly sin comprimir
    location ~ \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }
}
