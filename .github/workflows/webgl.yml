name: Compilar Unity WebGL

on:
  push:
    branches:
      - deploy
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/webgl.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Liberar espacio para Unity
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: false
          haskell: true
          large-packages: false
          docker-images: true
          preinstalled-runtimes: false
          swap-storage: false

      - name: Comprobar espacio disponible
        run: df -h

      - name: Compilar Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.11f1
          targetPlatform: WebGL

      - name: Guardar compilacion WebGL
        uses: actions/upload-artifact@v4
        with:
          name: Unity-WebGL
          path: build/

      - name: Preparar carpeta site
        run: |
          test -f build/WebGL/index.html
          test -d build/WebGL/Build
          rm -rf site
          mkdir -p site
          cp -a build/WebGL/. site/

      - name: Publicar WebGL en deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/
          if ! git diff --cached --quiet; then
            git commit -m "Publicar WebGL [skip ci]"
            git push origin HEAD:deploy
          fi
