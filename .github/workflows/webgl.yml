
name: Compilar Unity WebGL

on:
  push:
    branches:
      - deploy

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          lfs: true
          
      - name: Liberar espacio para Unity
        uses: jlumbroso/free-disk-space@v2
        with:
          android: true
          dotnet: false
          haskell: true
          large-packages: false
          docker-images: true
          preinstalled-runtimes: false
          swap-storage: false

      - name: Comprobar espacio disponible
        run: df -h
        
      - name: Compilar Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.11f1
          targetPlatform: WebGL

      - name: Guardar compilacion WebGL
        uses: actions/upload-artifact@v4
        with:
          name: Unity-WebGL
          path: build/
